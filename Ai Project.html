<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nutritionist AI Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
  <style>
    /* Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #fafafa;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      text-align: center;
      transition: background 0.5s, color 0.5s;
      overflow: hidden;
    }
    body.light-mode { background: #fff; color: #111; }
    /* Welcome screen */
    #welcome {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      color: #333;
      font-size: 32px;
      font-weight: bold;
      animation: fadeOut 2s 3s forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    .chatbot-sticker {
      width: 70px; height: 70px;
      background: url("https://cdn-icons-png.flaticon.com/512/4712/4712035.png") no-repeat center center;
      background-size: cover;
      position: fixed;
      bottom: 100px;
      right: 30px;
      z-index: 10;
      animation: floaty 3s ease-in-out infinite;
    }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .title {
      font-size: 32px; font-weight: 700;
      background: linear-gradient(45deg, #ff9c00, #ff5722);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 14px; color: #ff9c00; margin-bottom: 18px; }
    .chat-container {
      width: 90%; max-width: 700px; height: 60vh;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-radius: 20px; padding: 20px;
      box-shadow: 0 0 25px rgba(255, 140, 0, 0.3);
      overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
      transition: background 0.5s;
    }
    body.light-mode .chat-container { background: rgba(255,255,255,0.1); box-shadow: 0 0 25px rgba(0,0,0,0.1); }
    .chat-box { display: flex; flex-direction: column; }
    .chat-bubble {
      padding: 14px 20px; border-radius: 20px; font-size: 15px;
      max-width: 75%; word-wrap: break-word;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5); position: relative;
    }
    .chat-bubble img { max-width: 100%; border-radius: 15px; margin-top: 5px; }
    .chat-bubble::after {
      content: attr(data-time); font-size: 10px; color: #aaa;
      position: absolute; bottom: -16px; right: 0;
    }
    .user-chat { align-self: flex-end; background: linear-gradient(135deg, #ff5722, #ff9c00); color: #fff; }
    .ai-chat { align-self: flex-start; background: linear-gradient(135deg, #ff9c00, #ff5722); color: #fff; }
    .prompt-area {
      margin-top: 20px; display: flex; width: 90%; max-width: 700px; gap: 10px;
    }
    .prompt-area input[type="text"] {
      flex-grow: 1; padding: 14px 18px; border: none;
      border-radius: 30px; font-size: 15px;
      background: #fffae3; color: #333;
    }
    .prompt-area button {
      width: 50px; height: 50px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #ff9c00, #ff5722);
      color: white; font-size: 20px; font-weight: bold;
      cursor: pointer; transition: transform 0.2s ease;
    }
    .prompt-area button:hover { transform: scale(1.1); box-shadow: 0 0 10px #ff9c00; }
    .footer, .registration { margin-top: 10px; font-size: 12px; color: #888; }
    .registration { color: #ff9c00; }
    #theme-toggle {
      position: absolute; top: 20px; right: 20px;
      padding: 8px 14px; border-radius: 12px; border: none;
      background: #444; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="welcome">Welcome to Nutritionist AI Chatbot!</div>

  <div id="tsparticles"></div>
  <div class="chatbot-sticker"></div>
  <div class="title">Nutritionist AI Chatbot</div>
  <div class="subtitle">Get your health tips with AI 🍊</div>

  <button id="theme-toggle">Theme Mode</button>

  <div class="chat-container"></div>

  <div class="prompt-area">
    <input type="text" id="prompt" placeholder="Ask about nutrition or health..." />
    <button id="submit" title="Send">&#9658;</button>
    <!-- <button id="voice-command" title="Speak">&#127908;</button> -->
    <input type="file" id="image-upload" accept="image/*" style="display: none;">
    <button id="upload-btn" title="Upload Image">&#128247;</button>
  </div>

  <div class="footer">&copy; 2025 HealthTech Inc.</div>
  <div class="registration"> |</div>

  <audio id="sendSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

  <script>
    const promptInput = document.querySelector("#prompt");
    const submitBtn = document.querySelector("#submit");
    const chatContainer = document.querySelector(".chat-container");
    const themeBtn = document.getElementById("theme-toggle");
    const sendSound = document.getElementById("sendSound");
    const voiceBtn = document.getElementById("voice-command");
    const uploadBtn = document.getElementById("upload-btn");
    const imageUploadInput = document.getElementById("image-upload");

    const Api_Url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBJvhPW1ZSldEsWcGoNwgN4LuarfBPtnXY";

    function getTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1; utterance.pitch = 1;
      speechSynthesis.speak(utterance);
    }

    async function generateResponse(userMessage) {
      const aiChatBox = document.createElement("div");
      aiChatBox.classList.add("chat-box");
      const aiBubble = document.createElement("div");
      aiBubble.classList.add("chat-bubble", "ai-chat");
      aiBubble.textContent = "Typing...";
      aiBubble.setAttribute("data-time", getTime());
      aiChatBox.appendChild(aiBubble);
      chatContainer.appendChild(aiChatBox);
      aiBubble.scrollIntoView({behavior: "smooth"});

      const requestBody = {
        contents: [{ role: "user", parts: [{ text: userMessage }] }], 
        system_instruction: {
          role: "system",
          parts: [{ text: "You are an AI assistant for a nutritionist service. Help customers with health advice, nutrition tips, meal plans, and fitness recommendations." }]
        }
      };

      try {
        const response = await fetch(Api_Url, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });
        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        aiBubble.textContent = reply;
        speak(reply);
      } catch (error) {
        aiBubble.textContent = "Unable to provide advice. Please try again.";
      }
    }

    function handleUserMessage() {
      const userMessage = promptInput.value.trim();
      if (!userMessage) return;
      sendSound.play();
      const userChatBox = document.createElement("div");
      userChatBox.classList.add("chat-box");
      const userBubble = document.createElement("div");
      userBubble.classList.add("chat-bubble", "user-chat");
      userBubble.textContent = userMessage;
      userBubble.setAttribute("data-time", getTime());
      userChatBox.appendChild(userBubble);
      chatContainer.appendChild(userChatBox);
      userBubble.scrollIntoView({behavior: "smooth"});
      promptInput.value = "";
      generateResponse(userMessage);
    }

    promptInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleUserMessage(); });
    submitBtn.addEventListener("click", handleUserMessage);
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      loadParticles();
    });

    function loadParticles() {
      const isDark = !document.body.classList.contains("light-mode");
      tsParticles.load("tsparticles", {
        fullScreen: { enable: true, zIndex: -1 },
        particles: {
          number: { value: 70 },
          color: { value: isDark ? "#ffffff" : "#ff9c00" },
          links: { enable: true, color: isDark ? "#ffffff" : "#ff9c00" },
          move: { enable: true, speed: 1 },
          size: { value: 3 },
        },
        background: { color: isDark ? "#fafafa" : "#fff" },
      });
    }
    loadParticles();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
      recognition.continuous = false; recognition.lang = "en-US"; recognition.interimResults = false;
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        promptInput.value = transcript;
        handleUserMessage();
      };
      voiceBtn.addEventListener("click", () => recognition.start());
    } else {
      voiceBtn.disabled = true;
      voiceBtn.title = "Voice recognition not supported";
    }

    uploadBtn.addEventListener("click", () => imageUploadInput.click());
    imageUploadInput.addEventListener("change", async () => {
      const file = imageUploadInput.files[0];
      if (!file) return;
      const userChatBox = document.createElement("div");
      userChatBox.classList.add("chat-box");
      const userBubble = document.createElement("div");
      userBubble.classList.add("chat-bubble", "user-chat");
      userBubble.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="Uploaded Image">`;
      userBubble.setAttribute("data-time", getTime());
      userChatBox.appendChild(userBubble);
      chatContainer.appendChild(userChatBox);
      userBubble.scrollIntoView({behavior: "smooth"});
      generateImageResponse(file);
    });

    async function generateImageResponse(file) {
      const aiChatBox = document.createElement("div");
      aiChatBox.classList.add("chat-box");
      const aiBubble = document.createElement("div");
      aiBubble.classList.add("chat-bubble", "ai-chat");
      aiBubble.textContent = "Analyzing image...";
      aiBubble.setAttribute("data-time", getTime());
      aiChatBox.appendChild(aiBubble);
      chatContainer.appendChild(aiChatBox);
      aiBubble.scrollIntoView({behavior: "smooth"});

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Image = reader.result.split(',')[1];
        const requestBody = {
          contents: [{ role: "user", parts: [{ inline_data: { mime_type: file.type, data: base64Image } }] }],
          system_instruction: {
            role: "system",
            parts: [{ text: "You are an AI assistant for a nutritionist service. Analyze uploaded images carefully and respond appropriately." }]
          }
        };
        try {
          const response = await fetch(Api_Url, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
          });
          const data = await response.json();
          const reply = data.candidates[0].content.parts[0].text;
          aiBubble.textContent = reply;
          speak(reply);
        } catch (error) {
          aiBubble.textContent = "Sorry, couldn't analyze the image.";
        }
      };
      reader.readAsDataURL(file);
    }
  </script>

</body>
</html>
